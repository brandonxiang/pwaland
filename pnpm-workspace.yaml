packages:
  # specify a package in a direct subdir of the root
  - "projects/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@^0.1.21
  vite-plus: ^0.1.21
  vitest: npm:@voidzero-dev/vite-plus-test@^0.1.21
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
